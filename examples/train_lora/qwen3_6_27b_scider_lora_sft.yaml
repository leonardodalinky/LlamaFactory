### model
model_name_or_path: Qwen/Qwen3.6-27B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all

### dataset
# Registered in train/LlamaFactory/data/dataset_info.json — points to
# train/dataset/datafiles/*.jsonl produced by train/preprocess_data.py.
dataset: SciderTraj
template: qwen3_6
# Our SciDER trajectories carry no <think> blocks. enable_thinking=false
# tells LF's ReasoningTemplate to inject the empty <think></think>
# placeholder into the *prompt* side only (no loss), so the model's
# weights for actually generating thinking are never overwritten —
# Qwen3.6's native Thinking Preservation ability is preserved for
# downstream inference with enable_thinking=true.
enable_thinking: false
cutoff_len: 16384
max_samples: 1000000          # effectively no cap; ~7.7k rows after preprocessing
preprocessing_num_workers: 16
dataloader_num_workers: 4
mask_history: false           # train on every assistant turn, not just the last

### output
output_dir: saves/qwen3.6-27b-scider/lora/sft
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none               # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8    # effective batch = 1 * 8 * 2 GPUs = 16 → ~1260 steps for 3 epochs
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true
flash_attn: fa2
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### memory — DeepSpeed ZeRO-2 is sufficient on 2× H200 for a 27B dense with LoRA r=16
deepspeed: examples/deepspeed/ds_z2_config.json

### eval (optional — uncomment to hold out 5% as eval split)
# val_size: 0.05
# per_device_eval_batch_size: 1
# eval_strategy: steps
# eval_steps: 200
