### Note: DO NOT use quantized model or quantization_bit when merging lora adapters

### model
model_name_or_path: Qwen/Qwen3.6-27B
adapter_name_or_path: saves/qwen3.6-27b-scider/lora/sft
template: qwen3_6                 # MUST match training; mismatched template breaks the merged model
enable_thinking: false            # also must match training so empty think placeholder logic stays consistent
trust_remote_code: true
